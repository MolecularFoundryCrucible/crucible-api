name: tests

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_CONF_FILE: app/conf/api_conf_local.yaml
      CRUCIBLE_SECRET_KEY: ci-only
      PGDB_PW: ci-only
      DB_USERNAME: ci
      DB_SERVER: localhost
      DB_DATABASE: ci
      RABBITMQ_DEFAULT_PW: ci-only
      CRUCIBLE_TEST_PG_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_pg_test
      HUB_AUTH_TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_hub_auth_test
      SLUG_INDEX_TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_slug_index_test
      EMAIL_INDEX_TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_email_index_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Create test databases
        env:
          PGPASSWORD: ci
        run: |
          for db in crucible_pg_test crucible_hub_auth_test crucible_slug_index_test crucible_email_index_test; do
            psql -h localhost -U postgres -c "CREATE DATABASE $db"
          done
          psql -h localhost -U postgres -d crucible_pg_test -c "CREATE EXTENSION vector" -c "CREATE EXTENSION pg_trgm"
      - run: uv sync --locked
      - run: uv run pytest -q

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create secrets and settings as in the install guide
        run: |
          mkdir -p secrets && chmod 700 secrets
          for name in POSTGRES_PASSWORD PGDB_PW CRUCIBLE_SECRET_KEY; do
            openssl rand -hex 32 > "secrets/$name"
          done
          chmod 644 secrets/*
          cp .env.example .env
      - name: Start
        run: docker compose up -d --build --wait
      - name: Create the first administrator
        run: |
          docker compose run --rm -T api python -m app.cli admin create --no-input --first-name Smoke --last-name Admin > "$RUNNER_TEMP/admin.json"
          python3 -c "import json, sys; print('created', json.load(open(sys.argv[1]))['username'])" "$RUNNER_TEMP/admin.json"
      - name: Smoke test through the proxy
        env:
          CRUCIBLE_API_URL: http://localhost:8080/api/v3
        run: |
          CRUCIBLE_API_KEY=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['api_key'])" "$RUNNER_TEMP/admin.json")
          export CRUCIBLE_API_KEY
          python3 ../../scripts/selfhost_smoke.py
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove
        if: always()
        run: |
          docker compose down -v
          rm -f "$RUNNER_TEMP/admin.json"

  compose-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE: https://localhost:8443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the Hub at its pinned release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MolecularFoundryCrucible/crucible-hub
          ref: 7b17c2eb3db5d8925cc2f827c232305c4b09399f # v1.7.0
          path: hub
          persist-credentials: false
      - name: Start the API with Hub sign-in, over HTTPS with Caddy's local CA
        working-directory: deploy/compose
        run: |
          echo "CA=$RUNNER_TEMP/caddy-root.crt" >> "$GITHUB_ENV"
          CA="$RUNNER_TEMP/caddy-root.crt"
          mkdir -p secrets && chmod 700 secrets
          for name in POSTGRES_PASSWORD PGDB_PW CRUCIBLE_SECRET_KEY HUB_AUTH_CLIENT_SECRET; do
            openssl rand -hex 32 > "secrets/$name"
          done
          printf 'not-a-real-orcid-secret' > secrets/ORCID_CLIENT_SECRET
          chmod 644 secrets/*
          cp .env.example .env
          cat >> .env <<EOF
          COMPOSE_FILE=compose.yaml:compose.hub.yaml
          CRUCIBLE_SITE_ADDRESS=localhost
          CRUCIBLE_PUBLIC_URL=$SITE
          ORCID_CLIENT_ID=APP-SELFHOSTTEST0
          ORCID_ISSUER=https://sandbox.orcid.org
          EOF
          docker compose up -d --build --wait
          for _ in $(seq 30); do
            docker compose exec -T proxy test -s /data/caddy/pki/authorities/local/root.crt && break
            sleep 1
          done
          docker compose exec -T proxy cat /data/caddy/pki/authorities/local/root.crt > "$CA"
      - name: Start the Hub on the same machine, as in its README
        working-directory: hub/deploy/compose
        run: |
          mkdir -p secrets && chmod 700 secrets
          cp ../../../deploy/compose/secrets/HUB_AUTH_CLIENT_SECRET secrets/hub_auth_client_secret
          printf 'k1:%s' "$(openssl rand 32 | basenc --base64url | tr -d '=\n')" > secrets/hub_session_keys
          openssl rand -base64 32 | tr -d '\n' > secrets/hub_session_database_password
          openssl rand -base64 32 | tr -d '\n' > secrets/hub_db_admin_password
          chmod 444 secrets/hub_*
          cp example.env .env
          sed -i "s#^HUB_PUBLIC_ORIGIN=.*#HUB_PUBLIC_ORIGIN=$SITE#; s#^HUB_AUTH_PUBLIC_API_URL=.*#HUB_AUTH_PUBLIC_API_URL=$SITE/api/v3#" .env
          docker compose up -d --build --wait
      - name: The Hub answers through the front door and starts sign-in through the API
        run: |
          curl -fsS --cacert "$CA" "$SITE/hub/health" | grep -q '"sessions":"ok"'
          login=$(curl -sS --cacert "$CA" -o /dev/null -w '%{redirect_url}' "$SITE/hub/auth/login")
          case "$login" in "$SITE/api/v3/auth/hub/login?"*) ;; *) echo "Hub login went to $login"; exit 1;; esac
          orcid=$(curl -sS --cacert "$CA" -o /dev/null -w '%{redirect_url}' "$login")
          case "$orcid" in "https://sandbox.orcid.org/oauth/authorize?"*) ;; *) echo "API login went to ${orcid%%\?*}"; exit 1;; esac
          python3 -c "import sys; from urllib.parse import parse_qs, urlparse; q = parse_qs(urlparse(sys.argv[1]).query); assert q['redirect_uri'] == [sys.argv[2] + '/api/v3/auth/hub/callback'], q['redirect_uri']" "$orcid" "$SITE"
      - name: The Hub authenticates to the API with the shared secret
        working-directory: hub/deploy/compose
        run: |
          docker compose exec -T -e SITE hub node -e "
          const secret = require('fs').readFileSync('/run/secrets/HUB_AUTH_CLIENT_SECRET', 'utf8').trim();
          const body = JSON.stringify({code: 'c'.repeat(32), code_verifier: 'v'.repeat(43), redirect_uri: process.env.SITE + '/hub/auth/callback'});
          const call = pw => fetch('http://api:8000/auth/hub/token', {method: 'POST', body, headers: {'Content-Type': 'application/json', Authorization: 'Basic ' + Buffer.from('crucible-hub:' + pw).toString('base64')}})
            .then(async r => [r.status, (await r.json()).detail]);
          (async () => {
            const [right, wrong] = [await call(secret), await call('wrong')];
            console.log('right secret', right, 'wrong secret', wrong);
            const ok = right[0] === 401 && right[1] === 'Invalid or expired sign-in code' && wrong[0] === 401 && wrong[1] === 'Invalid client credentials';
            process.exit(ok ? 0 : 1);
          })();"
      - name: Neither project can reach the other's database, and containers hold no extra capabilities
        run: |
          (cd hub/deploy/compose && docker compose exec -T hub node -e "
          const net = require('net');
          const s = net.connect({host: 'db', port: 5432, timeout: 3000});
          s.on('connect', () => { console.log('hub reached db'); process.exit(1); });
          s.on('error', () => process.exit(0)); s.on('timeout', () => process.exit(0));")
          cd deploy/compose
          docker compose exec -T api python -c "
          import socket
          try:
              socket.create_connection(('hub-db', 5432), timeout=3)
          except OSError:
              pass
          else:
              raise SystemExit('api reached hub-db')"
          for service in api proxy; do
            caps=$(docker compose exec -T "$service" sh -c "grep CapEff /proc/1/status" | awk '{print $2}')
            echo "$service $caps"
          done
          test "$(docker compose exec -T api sh -c 'grep CapEff /proc/1/status' | awk '{print $2}')" = 0000000000000000
          test "$(docker compose exec -T proxy sh -c 'grep CapEff /proc/1/status' | awk '{print $2}')" = 0000000000000400
      # The API side of a second-machine Hub is only CRUCIBLE_HUB_UPSTREAM; the Hub's own calls to the API then go
      # over the public HTTPS address, which crucible-hub tests. Its API address here only has to be accepted.
      - name: The front door reaches a Hub that is off the shared network (second machine, simulated)
        run: |
          gateway=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          cd hub/deploy/compose
          docker compose down
          sed -i "s#^COMPOSE_FILE=.*#COMPOSE_FILE=compose.yaml:compose.published.yaml#; s#^CRUCIBLE_API_BASE_URL=.*#CRUCIBLE_API_BASE_URL=http://$gateway:8080/api/v3#" .env
          echo "HUB_BIND_ADDRESS=$gateway" >> .env
          docker compose up -d --wait
          cd ../../../deploy/compose
          echo "CRUCIBLE_HUB_UPSTREAM=$gateway:3000" >> .env
          docker compose up -d --wait
          curl -fsS --cacert "$CA" "$SITE/hub/health" | grep -q '"sessions":"ok"'
          if docker network inspect crucible --format '{{range .Containers}}{{.Name}} {{end}}' | grep -q hub; then echo "the Hub is still on the crucible network"; exit 1; fi
      - name: Removing the Hub leaves the API working
        working-directory: deploy/compose
        run: |
          (cd ../../hub/deploy/compose && docker compose down -v)
          sed -i '/^COMPOSE_FILE=/d; /^CRUCIBLE_HUB_UPSTREAM=/d' .env
          docker compose up -d --wait
          test "$(curl -sS --cacert "$CA" -o /dev/null -w '%{http_code}' "$SITE/hub/")" = 404
          curl -fsS --cacert "$CA" "$SITE/api/v3/health/ready" | grep -q '"schema_state":"current"'
          docker compose exec -T api python -c "from app.config import get_settings; assert not get_settings().hub.enabled"
      - name: Service logs
        if: failure()
        run: |
          (cd deploy/compose && docker compose logs --no-color)
          (cd hub/deploy/compose && docker compose logs --no-color)
      - name: Remove
        if: always()
        run: |
          (cd hub/deploy/compose && docker compose down -v) || true
          (cd deploy/compose && docker compose down -v)
