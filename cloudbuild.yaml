substitutions:
  _IMAGE_PATH: "us-central1-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${REPO_NAME}-${BRANCH_NAME}"

steps:
  # Pull latest for caching
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: [-c, 'docker pull ${_IMAGE_PATH}:latest || exit 0']

  # Build with both SHA tag and latest tag
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: [-c, 'docker build --build-arg BRANCH_NAME=${BRANCH_NAME} --build-arg githash=${SHORT_SHA} --build-arg api_version=$(git describe --tags --abbrev=0) -t ${_IMAGE_PATH}:${SHORT_SHA} -t ${_IMAGE_PATH}:latest --cache-from ${_IMAGE_PATH}:latest .']

  # Push SHA-tagged image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_PATH}:${SHORT_SHA}']

  # Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_PATH}:latest']

  # Apply ConfigMap first (deployment depends on it)
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
    - apply
    - -f
    - ./k8s-conf/configmap-${BRANCH_NAME}.yaml
    env:
    - CLOUDSDK_COMPUTE_REGION=us-central1
    - CLOUDSDK_CONTAINER_CLUSTER=crucible-cluster

  # Apply deployment (creates if doesn't exist, updates if exists)
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
    - apply
    - -f
    - ./k8s-conf/deployment-k8s-conf-${BRANCH_NAME}.yaml
    env:
    - CLOUDSDK_COMPUTE_REGION=us-central1
    - CLOUDSDK_CONTAINER_CLUSTER=crucible-cluster

  # Update the deployment with the new SHA-tagged image
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
    - set
    - image
    - deployment/crucible-api-${BRANCH_NAME}
    - crucible-api-container=${_IMAGE_PATH}:${SHORT_SHA}
    env:
    - CLOUDSDK_COMPUTE_REGION=us-central1
    - CLOUDSDK_CONTAINER_CLUSTER=crucible-cluster

timeout: 600s
