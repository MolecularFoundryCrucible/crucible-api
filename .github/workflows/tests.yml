name: tests

on:
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a pull request, run each slower job only when the pull request touches what it tests. Pushes
  # to main run everything, since staging deploys from main.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browsers: ${{ steps.areas.outputs.browsers }}
      storage: ${{ steps.areas.outputs.storage }}
      oidc: ${{ steps.areas.outputs.oidc }}
      bundle: ${{ steps.areas.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          areas="browsers storage oidc bundle"
          if [ "$EVENT" != "pull_request" ]; then
            for area in $areas; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          # A pull request is checked out as its merge with the base branch: the first parent is the base.
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          shared='^(pyproject\.toml|uv\.lock|\.python-version|app/config\.py|app/api/main\.py|app/api/dependencies\.py|\.github/workflows/tests\.yml)$'
          declare -A pattern=(
            [browsers]='^app/auth/|^app/templates/|^app/api/routes/(hub_auth|oauth|device|passwords)\.py$|^tests/test_auth_password_browser\.py$'
            [storage]='^app/storage/|^app/services/(multipart|storage_cleanup|storage_downloads|file_versions)\.py$|^app/api/routes/(files|multipart|gcs_storage)\.py$|^app/cli/storage\.py$|^tests/test_s3_store_integration\.py$'
            [oidc]='^app/auth/|^app/api/routes/(hub_auth|oauth|identities)\.py$|^app/utils/hub_(login|tokens)\.py$|^tests/test_auth_oidc_integration\.py$|^tests/fixtures/dex\.yaml$'
            [bundle]='^Dockerfile$|^\.dockerignore$|^alembic\.ini$|^app/|^migrations/|^scripts/'
          )
          for area in $areas; do
            if printf '%s\n' "$changed" | grep -Eq "$shared|${pattern[$area]}"; then answer=true; else answer=false; fi
            echo "$area=$answer" | tee -a "$GITHUB_OUTPUT"
          done

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_PUBLIC_URL: https://127.0.0.1:7777
      API_PATH: testapi
      CRUCIBLE_SECRET_KEY: ci-only-secret-key-of-32-characters
      PGDB_PW: ci-only
      DB_USERNAME: ci
      DB_SERVER: localhost
      DB_DATABASE: ci
      RABBITMQ_DEFAULT_PW: ci-only
      CRUCIBLE_TEST_PG_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_pg_test
      HUB_AUTH_TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_hub_auth_test
      SLUG_INDEX_TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_slug_index_test
      EMAIL_INDEX_TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_email_index_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Create test databases
        env:
          PGPASSWORD: ci
        run: |
          for db in crucible_pg_test crucible_hub_auth_test crucible_slug_index_test crucible_email_index_test; do
            psql -h localhost -U postgres -c "CREATE DATABASE $db"
          done
          psql -h localhost -U postgres -d crucible_pg_test -c "CREATE EXTENSION vector" -c "CREATE EXTENSION pg_trgm"
      - run: uv sync --locked
      - run: uv run pytest -q

  browsers:
    needs: changes
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_PUBLIC_URL: https://127.0.0.1:7777
      API_PATH: testapi
      CRUCIBLE_SECRET_KEY: ci-only-secret-key-of-32-characters
      CRUCIBLE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium firefox
      - run: uv run pytest -q -rs tests/test_auth_password_browser.py

  storage-s3:
    needs: changes
    if: needs.changes.outputs.storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_PUBLIC_URL: https://127.0.0.1:7777
      API_PATH: testapi
      CRUCIBLE_SECRET_KEY: ci-only-secret-key-of-32-characters
      PGDB_PW: ci-only
      DB_USERNAME: ci
      DB_SERVER: localhost
      DB_DATABASE: ci
      S3_TEST_ENDPOINTS: http://localhost:8333,http://localhost:7070
      S3_TEST_ACCESS_KEY: ci-access-key
      S3_TEST_SECRET_KEY: ci-secret-key-not-real
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Start SeaweedFS and Versity S3 Gateway
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_TEST_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_TEST_SECRET_KEY" -e S3_BUCKET=crucible-files,crucible-records \
            chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8 mini -dir=/data
          docker run -d --name versitygw -p 7070:7070 --tmpfs /data \
            -e ROOT_ACCESS_KEY_ID="$S3_TEST_ACCESS_KEY" -e ROOT_SECRET_ACCESS_KEY="$S3_TEST_SECRET_KEY" \
            versity/versitygw:v1.9.0@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7 posix /data
          uv sync --locked
          for port in 8333 7070; do
            for _ in $(seq 60); do curl -s -o /dev/null "http://localhost:$port/" && break; sleep 1; done
          done
          for _ in $(seq 60); do docker logs seaweedfs 2>&1 | grep -q "created bucket crucible-records" && break; sleep 1; done
      - name: Upload and download through the API against both
        shell: bash
        run: |
          uv run pytest -q -rs tests/test_s3_store_integration.py | tee "$RUNNER_TEMP/s3.txt"
          if grep -q "skipped" "$RUNNER_TEMP/s3.txt"; then echo "S3 integration tests were skipped"; exit 1; fi
      - name: storage check against both, as two stores
        env:
          RECORD_BUCKET: crucible-records
          STORAGE_DEFAULT_STORE: seaweedfs
          STORAGE_STORES: >-
            [{"id": "seaweedfs", "display_name": "SeaweedFS", "type": "s3", "bucket": "crucible-files", "endpoint_url": "http://localhost:8333"},
             {"id": "versity", "display_name": "Versity S3 Gateway", "type": "s3", "bucket": "crucible-files", "endpoint_url": "http://localhost:7070"}]
        run: |
          export STORAGE_SEAWEEDFS_ACCESS_KEY_ID="$S3_TEST_ACCESS_KEY" STORAGE_SEAWEEDFS_SECRET_ACCESS_KEY="$S3_TEST_SECRET_KEY"
          export STORAGE_VERSITY_ACCESS_KEY_ID="$S3_TEST_ACCESS_KEY" STORAGE_VERSITY_SECRET_ACCESS_KEY="$S3_TEST_SECRET_KEY"
          uv run python -m app.cli storage check
      - name: Server logs
        if: failure()
        run: |
          docker logs seaweedfs 2>&1 | tail -100
          docker logs versitygw 2>&1 | tail -100

  oidc-dex:
    needs: changes
    if: needs.changes.outputs.oidc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_PUBLIC_URL: https://127.0.0.1:7777
      API_PATH: testapi
      CRUCIBLE_SECRET_KEY: ci-only-secret-key-of-32-characters
      PGDB_PW: ci-only
      DB_USERNAME: ci
      DB_SERVER: localhost
      DB_DATABASE: ci
      OIDC_TEST_DEX_ISSUER: http://localhost:5556/dex
      OIDC_TEST_DEX_SECOND_ISSUER: http://localhost:5557/dex
      DEX_IMAGE: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Start two Dex servers, so the same subject exists at two issuers
        run: |
          sed 's#5556#5557#g' tests/fixtures/dex.yaml > "$RUNNER_TEMP/dex-second.yaml"
          docker run -d --name dex -p 5556:5556 -v "$PWD/tests/fixtures/dex.yaml:/etc/dex/config.yaml:ro" "$DEX_IMAGE" dex serve /etc/dex/config.yaml
          docker run -d --name dex-second -p 5557:5557 -v "$RUNNER_TEMP/dex-second.yaml:/etc/dex/config.yaml:ro" "$DEX_IMAGE" dex serve /etc/dex/config.yaml
          for issuer in "$OIDC_TEST_DEX_ISSUER" "$OIDC_TEST_DEX_SECOND_ISSUER"; do
            for _ in $(seq 60); do curl -fs -o /dev/null "$issuer/.well-known/openid-configuration" && break; sleep 1; done
            curl -fsS -o /dev/null "$issuer/.well-known/openid-configuration"
          done
      - run: uv sync --locked
      - name: Sign in through the Hub flow against both
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rs tests/test_auth_oidc_integration.py -k "not authentik" | tee "$RUNNER_TEMP/oidc.txt"
          if grep -q "skipped" "$RUNNER_TEMP/oidc.txt"; then echo "OIDC integration tests were skipped"; exit 1; fi
      - name: Server logs
        if: failure()
        run: |
          docker logs dex 2>&1 | tail -100
          docker logs dex-second 2>&1 | tail -100

  selfhost:
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRUCIBLE_API_IMAGE: crucible-api:ci
    defaults:
      run:
        working-directory: selfhost/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out crucible-selfhost
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MolecularFoundryCrucible/crucible-selfhost
          ref: main
          path: selfhost
          persist-credentials: false
      - name: Build the image
        working-directory: .
        run: docker build --tag "$CRUCIBLE_API_IMAGE" .
      - name: Install the bundle with this image, as in its guide
        run: |
          mkdir -p secrets && chmod 700 secrets
          for name in POSTGRES_PASSWORD PGDB_PW CRUCIBLE_SECRET_KEY CRUCIBLE_AUTH_PEPPER S3_SECRET_ACCESS_KEY; do
            openssl rand -hex 32 > "secrets/$name"
          done
          openssl rand -hex 16 > secrets/S3_ACCESS_KEY_ID
          chmod 644 secrets/*
          cp .env.example .env
          docker compose up -d --wait
      - name: Smoke test through the proxy
        env:
          CRUCIBLE_API_URL: http://localhost:8080/api/v4
        run: |
          docker compose run --rm -T api python -m app.cli admin create --no-input --first-name Smoke --last-name Admin > "$RUNNER_TEMP/admin.json"
          CRUCIBLE_API_KEY=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['api_key'])" "$RUNNER_TEMP/admin.json")
          CRUCIBLE_PASSWORD_LINK=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['password_link'])" "$RUNNER_TEMP/admin.json")
          export CRUCIBLE_API_KEY CRUCIBLE_PASSWORD_LINK
          python3 ../scripts/smoke.py
          docker compose exec -T api python -m app.cli storage check
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove
        if: always()
        run: |
          docker compose down -v
          rm -f "$RUNNER_TEMP/admin.json"

