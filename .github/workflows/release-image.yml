name: Release image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v4.0.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/molecularfoundrycrucible/crucible-api
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          declared=$(awk -F '"' '/^version = / {print $2; exit}' pyproject.toml)
          if [ "$version" != "$declared" ]; then
            echo "Tag $TAG does not match version $declared in pyproject.toml" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          docker buildx create --use --driver docker-container
          docker buildx build . \
            --platform "$PLATFORM" \
            --build-arg "githash=$commit" \
            --build-arg "api_version=$version" \
            --label "org.opencontainers.image.title=Crucible API" \
            --label "org.opencontainers.image.description=API of the Crucible scientific data platform" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=BSD-3-Clause" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$commit" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file metadata.json \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true"
          mkdir -p digests
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - name: Publish the multi-architecture tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version="${TAG#v}"
          sources=()
          for digest in digests/*; do sources+=("$IMAGE@sha256:$(basename "$digest")"); done
          tags=(--tag "$IMAGE:$version")
          case "$version" in
            *-*) ;;
            *) tags+=(--tag "$IMAGE:${version%.*}") ;;
          esac
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
