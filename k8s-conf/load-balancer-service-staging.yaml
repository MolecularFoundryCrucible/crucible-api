apiVersion: v1
kind: Service
metadata:
  name: crucible-api-staging-service
  namespace: default
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
  - 34.136.124.37/32
  ports:
  - port: 8889
    targetPort: 8889
    protocol: TCP
  selector:
    app: crucible-api-staging
---
apiVersion: v1
kind: Service
metadata:
  name: crucible-api-staging-ilb
  namespace: default
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.128.0.95
  loadBalancerSourceRanges:
  - 10.128.0.9/32
  ports:
  - port: 8889
    targetPort: 8889
    protocol: TCP
  selector:
    app: crucible-api-staging
