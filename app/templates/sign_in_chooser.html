{% extends "sign_in_base.html" %}
{% block title %}Sign in to Crucible{% endblock %}
{% block content %}
    <ul>
      {% for method in methods %}
      <li><a class="button" href="{{ method.href }}">{% if method.is_orcid %}{% include "marks/orcid_id.svg" %}{% endif %}<span>Sign in with {{ method.display_name }}</span></a></li>
      {% endfor %}
    </ul>
{% endblock %}
