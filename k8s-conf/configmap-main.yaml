apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "crucible-api-config-main"
  namespace: "default"
  labels:
    app: "crucible-api-main"
data:
  HUB_AUTH_ENABLED: "true"
  HUB_AUTH_CLIENT_ID: "crucible-hub"
  HUB_AUTH_CALLBACK_URI: "https://crucible.lbl.gov/hub/auth/callback"
  HUB_AUTH_PUBLIC_API_URL: "https://crucible.lbl.gov/api/v3"
  HUB_AUTH_ORCID_ISSUER: "https://orcid.org"
  HUB_AUTH_ORCID_CLIENT_ID: "APP-YDW1MRE405389PP0"
  HUB_AUTH_CLIENT_SECRET_VERSION: "projects/776258882599/secrets/crucible-hub-client-secret/versions/latest"
  HUB_AUTH_ORCID_CLIENT_SECRET_VERSION: "projects/776258882599/secrets/crucible-hub-orcid-client-secret/versions/latest"

  # api
  API_CONF_FILE: "app/conf/api_conf.yaml"
  ORCID_CLIENT_ID: "APP-E5VUS6XSJS5VFNEN"
  ORCID_CLIENT_SECRET_VERSION: "projects/776258882599/secrets/orcid_client_secret_esb/versions/latest"

  # rmq
  RMQ_ROUTING_SUFFIX: "main"
  
  # ai
  ANTHROPIC_BASE_URL: "https://api.cborg.lbl.gov"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "claude-haiku-4-5"

  # storage
  UPLOAD_BUCKET: "mf-storage-prod"
  RECORD_BUCKET: "mf-record-prod"
  MULTIPART_UPLOAD_ENABLED: "true"
  MULTIPART_UPLOAD_BUCKET: "mf-storage-prod"
  MULTIPART_UPLOAD_SIGNER: "crucible-mpu-signer-prod@mf-crucible.iam.gserviceaccount.com"
  MULTIPART_UPLOAD_PROJECT: "mf-crucible"

  # database
  db_type: "postgresql"
  db_server: "172.31.16.10:5432"
  db_username: "crucible-api-user"
  db_database: "crucible"
  db_auth: "true"
  EXPECTED_DB_REVISIONS: "b8f2d6e41c07"

  # pinned values the code defaulted to before self-hosting phase 1
  PGDB_PW_VERSION: "projects/776258882599/secrets/pgcloud_pw/versions/2"
  CRUCIBLE_SECRET_KEY_VERSION: "projects/776258882599/secrets/crucible_secret_key/versions/1"
  RABBITMQ_DEFAULT_PW_VERSION: "projects/776258882599/secrets/rabbitmq_default_pw/versions/1"
  GCS_SA_VERSION: "projects/776258882599/secrets/service-account-cred/versions/latest"
  MQTT_PASSWORD_VERSION: "projects/776258882599/secrets/mqtt-crucible-printers-passwd/versions/1"
  PROPDB_APIKEY_VERSION: "projects/776258882599/secrets/propdb-apikey/versions/1"
  RMQ_HOST: "10.128.0.31"
  RMQ_PORT: "5672"
  RMQ_USER: "admin"
  GCS_PROJECT: "crucible-prod"
  MQTT_HOST: "mqtt.mfdata.org"
  MQTT_PORT: "8883"
  MQTT_USERNAME: "crucible-printers"
  PROPOSAL_DB_URL: "https://foundry-admin.lbl.gov/api/JSON/sciCat-GetUser.aspx"
  PRINTING_ENABLED: "true"
  PROPOSAL_SYNC_ENABLED: "true"
  INGESTION_ENABLED: "true"
  PORT: "7777"
