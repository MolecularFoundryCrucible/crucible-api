    <script nonce="{{ script_nonce }}">
      (function () {
        const password = document.getElementById("password");
        const confirm = document.getElementById("confirm");
        const rule = document.getElementById("password-rule");
        const match = document.getElementById("confirm-rule");
        const minimum = Number(rule.dataset.min);
        const length = () => Array.from(password.value.normalize("NFC")).length;
        function check(leaving) {
          const count = length();
          rule.classList.toggle("met", count >= minimum);
          if (count >= minimum || count === 0) rule.classList.remove("unmet");
          else if (leaving) rule.classList.add("unmet");
          if (confirm.value === "") {
            match.hidden = true;
            confirm.setCustomValidity("");
            return;
          }
          const same = confirm.value === password.value;
          match.hidden = false;
          match.textContent = same ? "Passwords match" : "Passwords do not match";
          match.classList.toggle("met", same);
          match.classList.toggle("unmet", !same);
          confirm.setCustomValidity(same ? "" : "Passwords do not match");
        }
        password.addEventListener("input", () => check(false));
        password.addEventListener("blur", () => check(true));
        confirm.addEventListener("input", () => check(false));
        document.getElementById("show-password").addEventListener("change", function (event) {
          password.type = confirm.type = event.target.checked ? "text" : "password";
        });
      })();
    </script>
