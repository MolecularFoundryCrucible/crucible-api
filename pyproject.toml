[project]
name = "crucible-api"
version = "4.0.1"
description = "Crucible API: scientific records service for the Molecular Foundry"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=7.2.8",
    "fastapi==0.163.2",
    "google-api-core==2.24.0",
    "google-auth==2.62.2",
    "google-cloud-secret-manager==2.22.1",
    "google-cloud-storage>=3.4.1",
    "gunicorn",
    "mfid==2.0.0",
    "paho-mqtt>=2.1.0",
    "pika==1.5.0",
    "pillow==13.0.0",
    "pgvector>=0.4.1",
    "psycopg2-binary>=2.9.11",
    "python-multipart==0.0.34",
    "pydantic>=2.14,<3",
    "requests>=2.34.2",
    "joserfc>=1.7.7",
    "google-crc32c>=1.9.0",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.9",
    "sqlmodel==0.0.50",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "alembic>=1.19.1",
    "protobuf>=5.29.6,<6",
    "authlib>=1.9.5,<2",
    "pwdlib[argon2]==0.4.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings==2.16.3",
    "boto3==1.44.5",
    "awscrt==0.38.2",
    "jinja2>=3.1.6",
    "anyascii>=0.3.3",
    "email-validator>=2.2",
    "uvicorn-worker>=0.4.0",
]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "mako>=1.4.2",
    "pyasn1>=0.6.4",
    "starlette>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyflakes>=3.2.0",
    "playwright==1.65.2",
]
