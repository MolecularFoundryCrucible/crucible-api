<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <style nonce="{{ style_nonce }}">
    :root {
      color-scheme: light dark;
      --background: #fbfcfd;
      --card: #ffffff;
      --card-edge: rgb(10 15 19 / 0.1);
      --foreground: #0a0f13;
      --card-foreground: #091015;
      --action-surface: #ffffff;
      --action-border: #d1d9df;
      --action-hover: #edf1f4;
      --ring: #031e2d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0a0f13;
        --card: #11181d;
        --card-edge: rgb(251 252 253 / 0.1);
        --foreground: #fbfcfd;
        --card-foreground: #fafafa;
        --action-surface: #11181d;
        --action-border: #3f4951;
        --action-hover: #293238;
        --ring: #a8c4cd;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: "Noto Sans", ui-sans-serif, system-ui, sans-serif;
      background: var(--background);
      color: var(--foreground);
    }
    main {
      width: 100%;
      max-width: 36rem;
      padding: 1.5rem;
      background: var(--card);
      color: var(--card-foreground);
      border: 1px solid var(--card-edge);
      border-radius: 0.875rem;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }
    header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .logo { flex: none; width: 3rem; height: 3rem; border-radius: 0.625rem; overflow: hidden; }
    h1 { margin: 0; font-size: 1.75rem; line-height: 2.25rem; font-weight: 600; letter-spacing: -0.025em; }
    ul { display: flex; flex-direction: column; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      min-height: 2.25rem;
      padding: 0.25rem 0.625rem;
      border: 1px solid var(--action-border);
      border-radius: 0.625rem;
      background: var(--action-surface);
      color: var(--foreground);
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      font-size: 0.875rem;
      line-height: 1.25rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    a:hover { background: var(--action-hover); }
    a:focus-visible { outline: 3px solid color-mix(in oklch, var(--ring), transparent 35%); outline-offset: 2px; }
    .provider-mark { flex: none; width: 1.5rem; height: 1.5rem; }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <main>
    <header>
      {% include "marks/crucible_logo.svg" %}
      <h1>{{ self.title() }}</h1>
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
