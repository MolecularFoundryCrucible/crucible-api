apiVersion: v1
kind: Service
metadata:
  name: crucible-api-lb
  namespace: default
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
  - 34.136.124.37/32
  ports:
  - port: 7777
    targetPort: 7777
    protocol: TCP
  selector:
    app: crucible-api-main
---
apiVersion: v1
kind: Service
metadata:
  name: crucible-api-main-ilb
  namespace: default
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.128.0.83
  loadBalancerSourceRanges:
  - 10.128.0.9/32
  ports:
  - port: 7777
    targetPort: 7777
    protocol: TCP
  selector:
    app: crucible-api-main
