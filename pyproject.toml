    "google-cloud-secret-manager==2.22.1",
    "google-cloud-storage>=3.4.1",
    "gunicorn",
    "h5py==3.12.1",
    "imageio==2.37.0",
    "ipykernel>=7.1.0",
    "mfid==1.0.0",
    "networkx>=3.6.1",
    "numpy==2.2.2",
    "pg8000==1.31.2",
    "pika==1.3.2",
    "pillow==11.1.0",
    "pgvector>=0.4.1",
    "psycopg2-binary>=2.9.11",
    "python-jose==3.3.0",
    "python-multipart==0.0.20",
    "python2-secrets>=1.0.5",
    "pytz>=2025.2",
    "pyyaml==6.0.2",
    "sqlalchemy==2.0.37",
    "sqlmodel==0.0.22",
    "urllib3==2.1.0",
    "uvicorn==0.32.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "nano-crucible",
    "alembic>=1.19.1",
    "protobuf>=5.29.6,<6",
    "authlib>=1.8,<2",
