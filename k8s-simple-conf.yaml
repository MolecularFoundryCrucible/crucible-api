  name: "crucible-api"
  namespace: "default"
  resourceVersion: 
  uid: 
spec:
  selector:
    matchLabels:
      app: "crucible-api"
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        gke-gcsfuse/cpu-limit: "10"
        gke-gcsfuse/cpu-request: 500m
        gke-gcsfuse/memory-limit: 1000Gi
        gke-gcsfuse/memory-request: 1Gi
        gke-gcsfuse/volumes: "true"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/target: "8"
      labels:
        app: "crucible-api"
    spec:
      containers:
      - env:
        - name: "PYTHONUNBUFFERED"
          value: "True"
        - name: "DB_NAME"
          value: "testdb2"
        image: "us-central1-docker.pkg.dev/mf-crucible/crucible-api/crucible-api-main"
        imagePullPolicy: Always
        name: "crucible-api-container"
        resources:
          limits:
            cpu: 32000m
            memory: 32Gi
            ephemeral-storage: 2Gi
          requests:
            cpu: 4000m
            memory: 2Gi
            ephemeral-storage: 2Gi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /mnt/gcs
          name: cruc-upload-vol2
          readOnly: true
      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always
          # It is recommended to use the latest version of the Cloud SQL Auth Proxy
          # Make sure to update on a regular schedule!
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            # If connecting from a VPC-native GKE cluster, you can use the
            # following flag to have the proxy connect over private IP
            - "--private-ip"

            # If you are not connecting with Automatic IAM, you can delete
            # the following flag.
            - "--auto-iam-authn"

            # Enable structured logging with LogEntry format:
            - "--structured-logs"

            # Replace DB_PORT with the port the proxy should listen on
            - "--port=5432"
            - "mf-crucible:us-central1:testdb2"

          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"

      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: crucible-k8s-ksa
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      volumes:
      - name: cruc-upload-vol2
        persistentVolumeClaim:
          claimName: cruc-upload-pvc2
          readOnly: true


