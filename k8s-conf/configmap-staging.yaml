apiVersion: v1
kind: ConfigMap
metadata:
  name: crucible-api-config-staging
  namespace: default
data:
  # api
  API_CONF_FILE: "app/conf/api_conf-staging.yaml"
  hostname: "crucible.lbl.gov"
  api_path: "api/v1"
  orcid_client_id: "APP-AXDIPEVR6IMA0RL7"
  gcs_config_name: "mf-cloud-storage"

  # rmq
  RMQ_ROUTING_SUFFIX: "staging"

  # ai
  ANTHROPIC_BASE_URL: "https://api.cborg.lbl.gov"
  ANTHROPIC_DEFAULT_HAIKU_MODEL: "claude-haiku-4-5"

  # permission migration
  # Runs the new permission check alongside the old one, acts on the old
  # answer, logs disagreements. Set to "0" to switch off without a deploy.
  PERMISSION_SHADOW_MODE: "1"

  # database
  db_type: "postgresql"
  db_server: "172.31.16.10:5432"
  db_username: "crucible-api-user"
  db_database: "crucible-staging"
  db_auth: "true"
