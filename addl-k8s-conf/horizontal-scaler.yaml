---
apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "cruc-api-hpa-ryc4"
  namespace: "default"
  labels:
    app: "crucible-api"
spec:
  scaleTargetRef:
    kind: "Deployment"
    name: "crucible-api"
    apiVersion: "apps/v1"
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: "Resource"
    resource:
      name: "cpu"
      target:
        type: "Utilization"
        averageUtilization: 8
      