name: Release image

# Every commit on main is built once, for amd64 and arm64, and published as :sha-<commit> and :main.
# A vX.Y.Z tag adds X.Y.Z and X.Y to that same image without rebuilding, so a release runs exactly
# the image staging tested.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to point at its main build again, for example v4.0.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/molecularfoundrycrucible/crucible-api

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/^version = / {print $2; exit}' pyproject.toml)
          docker buildx create --use --driver docker-container
          docker buildx build . \
            --platform "$PLATFORM" \
            --build-arg "githash=$GITHUB_SHA" \
            --build-arg "api_version=$version" \
            --label "org.opencontainers.image.title=Crucible API" \
            --label "org.opencontainers.image.description=API of the Crucible scientific data platform" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=BSD-3-Clause" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file metadata.json \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true"
          mkdir -p digests
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - name: Publish :sha-<commit> and :main
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          sources=()
          for digest in digests/*; do sources+=("$IMAGE@sha256:$(basename "$digest")"); done
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" --tag "$IMAGE:main" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Tag the image main built for this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          declared=$(awk -F '"' '/^version = / {print $2; exit}' pyproject.toml)
          if [ "$version" != "$declared" ]; then
            echo "Tag $TAG does not match version $declared in pyproject.toml" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          source="$IMAGE:sha-$commit"
          if ! digest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -re .digest)"; then
            echo "No image $source: merge the commit to main and wait for its build before tagging" >&2
            exit 1
          fi
          tags=("$version")
          case "$version" in
            *-*) ;;
            *) tags+=("${version%.*}") ;;
          esac
          arguments=()
          for tag in "${tags[@]}"; do arguments+=(--tag "$IMAGE:$tag"); done
          docker buildx imagetools create "${arguments[@]}" "$IMAGE@$digest"
          for tag in "${tags[@]}"; do
            tagged="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            if [ "$tagged" != "$digest" ]; then
              echo "$IMAGE:$tag has digest $tagged, not $digest from $source" >&2
              exit 1
            fi
          done
          echo "Released $IMAGE@$digest as ${tags[*]} ($TAG, $commit)"
