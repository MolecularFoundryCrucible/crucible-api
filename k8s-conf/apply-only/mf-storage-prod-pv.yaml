apiVersion: v1
kind: PersistentVolume
metadata:
  name: mf-storage-prod-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 500Gi
  storageClassName: mf-storage-prod
  mountOptions:
    - implicit-dirs
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: mf-storage-prod
    volumeAttributes:
      gcsfuseLoggingSeverity: warning