apiVersion: v1
kind: PersistentVolume
metadata:
  name: cruc-upload-pv2
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 500Gi
  storageClassName: crucible-uploads
  mountOptions:
    - implicit-dirs
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: crucible-uploads
    volumeAttributes:
      gcsfuseLoggingSeverity: warning