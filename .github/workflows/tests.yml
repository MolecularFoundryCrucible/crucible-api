name: tests

on:
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a pull request, run each slower job only when the pull request touches what it tests. Pushes
  # to main run everything, since staging deploys from main.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browsers: ${{ steps.areas.outputs.browsers }}
      storage: ${{ steps.areas.outputs.storage }}
      oidc: ${{ steps.areas.outputs.oidc }}
      bundle: ${{ steps.areas.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          areas="browsers storage oidc bundle"
          if [ "$EVENT" != "pull_request" ]; then
            for area in $areas; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          # A pull request is checked out as its merge with the base branch: the first parent is the base.
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          shared='^(pyproject\.toml|uv\.lock|\.python-version|app/config\.py|app/api/main\.py|app/api/dependencies\.py|\.github/workflows/tests\.yml)$'
          declare -A pattern=(
            [browsers]='^app/auth/|^app/templates/|^app/api/routes/(hub_auth|oauth|device|passwords)\.py$|^tests/test_auth_password_browser\.py$'
            [storage]='^app/storage/|^app/services/(multipart|storage_cleanup|storage_downloads|file_versions)\.py$|^app/api/routes/(files|multipart|gcs_storage)\.py$|^app/cli/storage\.py$|^tests/test_s3_store_integration\.py$'
            [oidc]='^app/auth/|^app/api/routes/(hub_auth|oauth|identities)\.py$|^app/utils/hub_(login|tokens)\.py$|^tests/test_auth_oidc_integration\.py$|^tests/fixtures/dex\.yaml$'
            [bundle]='^Dockerfile$|^\.dockerignore$|^alembic\.ini$|^deploy/|^app/|^migrations/|^scripts/'
          )
          for area in $areas; do
            if printf '%s\n' "$changed" | grep -Eq "$shared|${pattern[$area]}"; then answer=true; else answer=false; fi
            echo "$area=$answer" | tee -a "$GITHUB_OUTPUT"
          done

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_CONF_FILE: app/conf/api_conf_local.yaml
      CRUCIBLE_SECRET_KEY: ci-only
      PGDB_PW: ci-only
      DB_USERNAME: ci
      DB_SERVER: localhost
      DB_DATABASE: ci
      RABBITMQ_DEFAULT_PW: ci-only
      CRUCIBLE_TEST_PG_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_pg_test
      HUB_AUTH_TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_hub_auth_test
      SLUG_INDEX_TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_slug_index_test
      EMAIL_INDEX_TEST_DATABASE_URL: postgresql+psycopg2://postgres:ci@localhost:5432/crucible_email_index_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Create test databases
        env:
          PGPASSWORD: ci
        run: |
          for db in crucible_pg_test crucible_hub_auth_test crucible_slug_index_test crucible_email_index_test; do
            psql -h localhost -U postgres -c "CREATE DATABASE $db"
          done
          psql -h localhost -U postgres -d crucible_pg_test -c "CREATE EXTENSION vector" -c "CREATE EXTENSION pg_trgm"
      - run: uv sync --locked
      - run: uv run pytest -q

  browsers:
    needs: changes
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_CONF_FILE: app/conf/api_conf_local.yaml
      CRUCIBLE_SECRET_KEY: ci-only
      CRUCIBLE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium firefox
      - run: uv run pytest -q -rs tests/test_auth_password_browser.py

  storage-s3:
    needs: changes
    if: needs.changes.outputs.storage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_CONF_FILE: app/conf/api_conf_local.yaml
      CRUCIBLE_SECRET_KEY: ci-only
      PGDB_PW: ci-only
      DB_USERNAME: ci
      DB_SERVER: localhost
      DB_DATABASE: ci
      S3_TEST_ENDPOINTS: http://localhost:8333,http://localhost:7070
      S3_TEST_ACCESS_KEY: ci-access-key
      S3_TEST_SECRET_KEY: ci-secret-key-not-real
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Start SeaweedFS and Versity S3 Gateway
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_TEST_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_TEST_SECRET_KEY" -e S3_BUCKET=crucible-files,crucible-records \
            chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8 mini -dir=/data
          docker run -d --name versitygw -p 7070:7070 --tmpfs /data \
            -e ROOT_ACCESS_KEY_ID="$S3_TEST_ACCESS_KEY" -e ROOT_SECRET_ACCESS_KEY="$S3_TEST_SECRET_KEY" \
            versity/versitygw:v1.9.0@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7 posix /data
          uv sync --locked
          for port in 8333 7070; do
            for _ in $(seq 60); do curl -s -o /dev/null "http://localhost:$port/" && break; sleep 1; done
          done
          for _ in $(seq 60); do docker logs seaweedfs 2>&1 | grep -q "created bucket crucible-records" && break; sleep 1; done
      - name: Upload and download through the API against both
        shell: bash
        run: |
          uv run pytest -q -rs tests/test_s3_store_integration.py | tee "$RUNNER_TEMP/s3.txt"
          if grep -q "skipped" "$RUNNER_TEMP/s3.txt"; then echo "S3 integration tests were skipped"; exit 1; fi
      - name: storage check against both
        env:
          STORAGE_BACKEND: s3
          UPLOAD_BUCKET: crucible-files
          RECORD_BUCKET: crucible-records
        run: |
          export S3_ACCESS_KEY_ID="$S3_TEST_ACCESS_KEY" S3_SECRET_ACCESS_KEY="$S3_TEST_SECRET_KEY"
          for endpoint in ${S3_TEST_ENDPOINTS//,/ }; do
            S3_ENDPOINT_URL="$endpoint" uv run python -m app.cli storage check
          done
      - name: Server logs
        if: failure()
        run: |
          docker logs seaweedfs 2>&1 | tail -100
          docker logs versitygw 2>&1 | tail -100

  oidc-dex:
    needs: changes
    if: needs.changes.outputs.oidc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_CONF_FILE: app/conf/api_conf_local.yaml
      CRUCIBLE_SECRET_KEY: ci-only
      PGDB_PW: ci-only
      DB_USERNAME: ci
      DB_SERVER: localhost
      DB_DATABASE: ci
      OIDC_TEST_DEX_ISSUER: http://localhost:5556/dex
      OIDC_TEST_DEX_SECOND_ISSUER: http://localhost:5557/dex
      DEX_IMAGE: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Start two Dex servers, so the same subject exists at two issuers
        run: |
          sed 's#5556#5557#g' tests/fixtures/dex.yaml > "$RUNNER_TEMP/dex-second.yaml"
          docker run -d --name dex -p 5556:5556 -v "$PWD/tests/fixtures/dex.yaml:/etc/dex/config.yaml:ro" "$DEX_IMAGE" dex serve /etc/dex/config.yaml
          docker run -d --name dex-second -p 5557:5557 -v "$RUNNER_TEMP/dex-second.yaml:/etc/dex/config.yaml:ro" "$DEX_IMAGE" dex serve /etc/dex/config.yaml
          for issuer in "$OIDC_TEST_DEX_ISSUER" "$OIDC_TEST_DEX_SECOND_ISSUER"; do
            for _ in $(seq 60); do curl -fs -o /dev/null "$issuer/.well-known/openid-configuration" && break; sleep 1; done
            curl -fsS -o /dev/null "$issuer/.well-known/openid-configuration"
          done
      - run: uv sync --locked
      - name: Sign in through the Hub flow against both
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rs tests/test_auth_oidc_integration.py -k "not authentik" | tee "$RUNNER_TEMP/oidc.txt"
          if grep -q "skipped" "$RUNNER_TEMP/oidc.txt"; then echo "OIDC integration tests were skipped"; exit 1; fi
      - name: Server logs
        if: failure()
        run: |
          docker logs dex 2>&1 | tail -100
          docker logs dex-second 2>&1 | tail -100

  compose-smoke:
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create secrets and settings as in the install guide
        run: |
          mkdir -p secrets && chmod 700 secrets
          for name in POSTGRES_PASSWORD PGDB_PW CRUCIBLE_SECRET_KEY S3_SECRET_ACCESS_KEY; do
            openssl rand -hex 32 > "secrets/$name"
          done
          openssl rand -hex 16 > secrets/S3_ACCESS_KEY_ID
          chmod 644 secrets/*
          cp .env.example .env
      - name: Start
        run: docker compose up -d --build --wait
      - name: Create the first administrator
        run: |
          docker compose run --rm -T api python -m app.cli admin create --no-input --first-name Smoke --last-name Admin > "$RUNNER_TEMP/admin.json"
          python3 -c "import json, sys; print('created', json.load(open(sys.argv[1]))['username'])" "$RUNNER_TEMP/admin.json"
      - name: Smoke test through the proxy
        env:
          CRUCIBLE_API_URL: http://localhost:8080/api/v3
        run: |
          CRUCIBLE_API_KEY=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['api_key'])" "$RUNNER_TEMP/admin.json")
          export CRUCIBLE_API_KEY
          python3 ../../scripts/selfhost_smoke.py
      - name: Storage check inside the API container
        run: docker compose exec -T api python -m app.cli storage check
      - name: Sign-in cleanup runs and its service stays up
        run: |
          docker compose exec -T api python -m app.cli auth cleanup --dry-run
          test -n "$(docker compose ps -q --status running auth-cleanup)"
      - name: Back up the stored files as in the install guide
        run: |
          mkdir -p "$RUNNER_TEMP/backups/files"
          CRUCIBLE_BACKUP_DIR="$RUNNER_TEMP/backups" docker compose run --rm --user "$(id -u):$(id -g)" files-backup
          find "$RUNNER_TEMP/backups/files/crucible-files" -path '*/_files/*' -type f | grep -q .
          find "$RUNNER_TEMP/backups/files/crucible-records" -name record.json -not -path '*/_crucible-check/*' | grep -q .
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove
        if: always()
        run: |
          docker compose down -v
          rm -f "$RUNNER_TEMP/admin.json"

  compose-hub:
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE: https://localhost:8443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the Hub's compose files at its pinned release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MolecularFoundryCrucible/crucible-hub
          ref: f41e0cfb2b9d981f33acd82899576ac2e5b6e631 # v1.7.1
          path: hub
          persist-credentials: false
      - name: Start the API with Hub sign-in, over HTTPS with Caddy's local CA
        working-directory: deploy/compose
        run: |
          echo "CA=$RUNNER_TEMP/caddy-root.crt" >> "$GITHUB_ENV"
          CA="$RUNNER_TEMP/caddy-root.crt"
          mkdir -p secrets && chmod 700 secrets
          for name in POSTGRES_PASSWORD PGDB_PW CRUCIBLE_SECRET_KEY HUB_AUTH_CLIENT_SECRET S3_SECRET_ACCESS_KEY; do
            openssl rand -hex 32 > "secrets/$name"
          done
          openssl rand -hex 16 > secrets/S3_ACCESS_KEY_ID
          printf 'not-a-real-orcid-secret' > secrets/ORCID_CLIENT_SECRET
          chmod 644 secrets/*
          cp .env.example .env
          cat >> .env <<EOF
          COMPOSE_FILE=compose.yaml:compose.hub.yaml
          CRUCIBLE_SITE_ADDRESS=localhost
          CRUCIBLE_PUBLIC_URL=$SITE
          ORCID_CLIENT_ID=APP-SELFHOSTTEST0
          ORCID_ISSUER=https://sandbox.orcid.org
          EOF
          docker compose up -d --build --wait
          for _ in $(seq 30); do
            docker compose exec -T proxy test -s /data/caddy/pki/authorities/local/root.crt && break
            sleep 1
          done
          docker compose exec -T proxy cat /data/caddy/pki/authorities/local/root.crt > "$CA"
      - name: Start the Hub from its published image on the same machine, as in its README
        working-directory: hub/deploy/compose
        run: |
          mkdir -p secrets && chmod 700 secrets
          cp ../../../deploy/compose/secrets/HUB_AUTH_CLIENT_SECRET secrets/hub_auth_client_secret
          printf 'k1:%s' "$(openssl rand 32 | basenc --base64url | tr -d '=\n')" > secrets/hub_session_keys
          openssl rand -base64 32 | tr -d '\n' > secrets/hub_session_database_password
          openssl rand -base64 32 | tr -d '\n' > secrets/hub_db_admin_password
          chmod 444 secrets/hub_*
          cp example.env .env
          sed -i "s#^HUB_PUBLIC_ORIGIN=.*#HUB_PUBLIC_ORIGIN=$SITE#; s#^HUB_AUTH_PUBLIC_API_URL=.*#HUB_AUTH_PUBLIC_API_URL=$SITE/api/v3#" .env
          echo "HUB_IMAGE=ghcr.io/molecularfoundrycrucible/crucible-hub:1.7.1@sha256:4694703a29a978d84253b24550bc329fb249f67b0ceaa56daf48ac06b495b0d8" >> .env
          docker compose pull hub hub-setup
          docker compose up -d --wait
          test "$(docker inspect "$(docker compose ps -q hub)" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "1.7.1"
      - name: The Hub answers through the front door and starts sign-in through the API
        run: |
          curl -fsS --cacert "$CA" "$SITE/hub/health" | grep -q '"sessions":"ok"'
          login=$(curl -sS --cacert "$CA" -o /dev/null -w '%{redirect_url}' "$SITE/hub/auth/login")
          case "$login" in "$SITE/api/v3/auth/hub/login?"*) ;; *) echo "Hub login went to $login"; exit 1;; esac
          orcid=$(curl -sS --cacert "$CA" -o /dev/null -w '%{redirect_url}' "$login")
          case "$orcid" in "https://sandbox.orcid.org/oauth/authorize?"*) ;; *) echo "API login went to ${orcid%%\?*}"; exit 1;; esac
          python3 -c "import sys; from urllib.parse import parse_qs, urlparse; q = parse_qs(urlparse(sys.argv[1]).query); assert q['redirect_uri'] == [sys.argv[2] + '/api/v3/auth/hub/callback'], q['redirect_uri']" "$orcid" "$SITE"
      - name: The Hub authenticates to the API with the shared secret
        working-directory: hub/deploy/compose
        run: |
          docker compose exec -T -e SITE hub node -e "
          const secret = require('fs').readFileSync('/run/secrets/HUB_AUTH_CLIENT_SECRET', 'utf8').trim();
          const body = JSON.stringify({code: 'c'.repeat(32), code_verifier: 'v'.repeat(43), redirect_uri: process.env.SITE + '/hub/auth/callback'});
          const call = pw => fetch('http://api:8000/auth/hub/token', {method: 'POST', body, headers: {'Content-Type': 'application/json', Authorization: 'Basic ' + Buffer.from('crucible-hub:' + pw).toString('base64')}})
            .then(async r => [r.status, (await r.json()).detail]);
          (async () => {
            const [right, wrong] = [await call(secret), await call('wrong')];
            console.log('right secret', right, 'wrong secret', wrong);
            const ok = right[0] === 401 && right[1] === 'Invalid or expired sign-in code' && wrong[0] === 401 && wrong[1] === 'Invalid client credentials';
            process.exit(ok ? 0 : 1);
          })();"
      - name: Neither project can reach the other's database, the Hub cannot reach the store, and containers hold no extra capabilities
        run: |
          for target in db:5432 seaweedfs:8333; do
            (cd hub/deploy/compose && docker compose exec -T -e TARGET="$target" hub node -e "
            const net = require('net');
            const [host, port] = process.env.TARGET.split(':');
            const s = net.connect({host, port: Number(port), timeout: 3000});
            s.on('connect', () => { console.log('hub reached ' + process.env.TARGET); process.exit(1); });
            s.on('error', () => process.exit(0)); s.on('timeout', () => process.exit(0));")
          done
          cd deploy/compose
          docker compose exec -T api python -c "
          import socket
          try:
              socket.create_connection(('hub-db', 5432), timeout=3)
          except OSError:
              pass
          else:
              raise SystemExit('api reached hub-db')"
          for service in api proxy; do
            caps=$(docker compose exec -T "$service" sh -c "grep CapEff /proc/1/status" | awk '{print $2}')
            echo "$service $caps"
          done
          test "$(docker compose exec -T api sh -c 'grep CapEff /proc/1/status' | awk '{print $2}')" = 0000000000000000
          test "$(docker compose exec -T api id -u)" = 10001
          ! docker compose exec -T api touch /app/app/written-at-run-time
          docker compose exec -T api touch /tmp/scratch
          test "$(docker compose exec -T proxy sh -c 'grep CapEff /proc/1/status' | awk '{print $2}')" = 0000000000000400
          test "$(docker compose exec -T seaweedfs sh -c 'grep CapEff /proc/1/status' | awk '{print $2}')" = 0000000000000000
      # The API side of a second-machine Hub is only CRUCIBLE_HUB_UPSTREAM; the Hub's own calls to the API then go
      # over the public HTTPS address, which crucible-hub tests. Its API address here only has to be accepted.
      - name: The front door reaches a Hub that is off the shared network (second machine, simulated)
        run: |
          gateway=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          cd hub/deploy/compose
          docker compose down
          sed -i "s#^COMPOSE_FILE=.*#COMPOSE_FILE=compose.yaml:compose.published.yaml#; s#^CRUCIBLE_API_BASE_URL=.*#CRUCIBLE_API_BASE_URL=http://$gateway:8080/api/v3#" .env
          echo "HUB_BIND_ADDRESS=$gateway" >> .env
          docker compose up -d --wait
          cd ../../../deploy/compose
          echo "CRUCIBLE_HUB_UPSTREAM=$gateway:3000" >> .env
          docker compose up -d --wait
          curl -fsS --cacert "$CA" "$SITE/hub/health" | grep -q '"sessions":"ok"'
          if docker network inspect crucible --format '{{range .Containers}}{{.Name}} {{end}}' | grep -q hub; then echo "the Hub is still on the crucible network"; exit 1; fi
      - name: Removing the Hub leaves the API working
        working-directory: deploy/compose
        run: |
          (cd ../../hub/deploy/compose && docker compose down -v)
          sed -i '/^COMPOSE_FILE=/d; /^CRUCIBLE_HUB_UPSTREAM=/d' .env
          docker compose up -d --wait
          test "$(curl -sS --cacert "$CA" -o /dev/null -w '%{http_code}' "$SITE/hub/")" = 404
          curl -fsS --cacert "$CA" "$SITE/api/v3/health/ready" | grep -q '"schema_state":"current"'
          docker compose exec -T api python -c "from app.config import get_settings; assert not get_settings().hub.enabled"
      - name: Service logs
        if: failure()
        run: |
          (cd deploy/compose && docker compose logs --no-color)
          (cd hub/deploy/compose && docker compose logs --no-color)
      - name: Remove
        if: always()
        run: |
          (cd hub/deploy/compose && docker compose down -v) || true
          (cd deploy/compose && docker compose down -v)
