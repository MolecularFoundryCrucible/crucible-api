      <label>{{ password_label }}
        <input type="password" name="password" id="password" autocomplete="new-password" required minlength="{{ min_length }}" maxlength="1024" aria-describedby="password-rule"{% if password_autofocus %} autofocus{% endif %}>
      </label>
      <p class="rule" id="password-rule" data-min="{{ min_length }}" aria-live="polite">At least {{ min_length }} characters</p>
      <label>Confirm password
        <input type="password" name="confirm" id="confirm" autocomplete="new-password" required maxlength="1024" aria-describedby="confirm-rule">
      </label>
      <p class="rule" id="confirm-rule" aria-live="polite" hidden></p>
      <label class="check"><input type="checkbox" id="show-password"> Show password</label>
