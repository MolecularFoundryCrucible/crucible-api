<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <style nonce="{{ style_nonce }}">
    :root {
      color-scheme: light dark;
      --page: #f4f7f9;
      --card: #ffffff;
      --line: #d3dce2;
      --line-strong: #8a9aa5;
      --text: #0b1820;
      --muted: #4e5f6a;
      --ink: #031e2d;
      --ink-hover: #0c3248;
      --on-ink: #ffffff;
      --field: #ffffff;
      --hover: #edf2f5;
      --ring: #3f7f96;
      --danger: #b42318;
      --danger-surface: #fdeeec;
      --success: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #091016;
        --card: #111a21;
        --line: #2c3a44;
        --line-strong: #5d6f7b;
        --text: #eef3f6;
        --muted: #a3b3bd;
        --ink: #e3ecf0;
        --ink-hover: #ffffff;
        --on-ink: #031e2d;
        --field: #0c141a;
        --hover: #1a262e;
        --ring: #a8c4cd;
        --danger: #ff9a90;
        --danger-surface: #36140f;
        --success: #4cc264;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem;
      font: 0.9375rem/1.5 "Noto Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--text);
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 25rem;
      padding: 2rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.875rem;
      box-shadow: 0 1px 2px rgb(3 30 45 / 0.06), 0 12px 28px -16px rgb(3 30 45 / 0.22);
    }
    .brand { display: flex; align-items: center; gap: 0.625rem; font-weight: 600; }
    .logo { flex: none; width: 2.25rem; height: 2.25rem; border-radius: 0.5rem; overflow: hidden; }
    h1 { margin: 0.25rem 0 0; font-size: 1.5rem; line-height: 1.25; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
    p { margin: 0; }
    strong { font-weight: 600; }
    a { color: inherit; text-underline-offset: 0.15em; }
    ul { display: flex; flex-direction: column; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }

    form { display: flex; flex-direction: column; gap: 1rem; }
    label { display: flex; flex-direction: column; gap: 0.375rem; font-size: 0.875rem; font-weight: 600; }
    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      height: 2.75rem;
      padding: 0 0.75rem;
      border: 1px solid var(--line-strong);
      border-radius: 0.5rem;
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      font-weight: 400;
    }
    input[type="checkbox"] { width: 1rem; height: 1rem; margin: 0; accent-color: var(--ink); }
    .check { flex-direction: row; align-items: center; gap: 0.5rem; font-weight: 400; }
    input.code-entry { height: 3.25rem; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 1.375rem; letter-spacing: 0.18em; text-align: center; text-transform: uppercase; }
    input.code-entry::placeholder { color: var(--muted); opacity: 0.6; }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      min-height: 2.75rem;
      padding: 0.375rem 1rem;
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    .button:hover { background: var(--hover); }
    .button.primary { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
    .button.primary:hover { border-color: var(--ink-hover); background: var(--ink-hover); }
    input:focus-visible, .button:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    .actions { display: flex; flex-direction: column; gap: 0.5rem; }
    .actions.pair { flex-direction: row-reverse; }
    .actions.pair > * { flex: 1; }
    .provider-mark { flex: none; width: 1.375rem; height: 1.375rem; }

    .alert { padding: 0.625rem 0.75rem; border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); border-radius: 0.5rem; background: var(--danger-surface); color: var(--danger); font-size: 0.875rem; }
    .rule { margin-top: -0.625rem; font-size: 0.8125rem; color: var(--muted); }
    .rule.met { color: var(--success); }
    .rule.met::before { content: "\2713\00a0"; }
    .rule.unmet { color: var(--danger); }
    .note { color: var(--muted); font-size: 0.875rem; }
    .facts { display: grid; grid-template-columns: max-content 1fr; gap: 0.375rem 1rem; margin: 0; padding: 0.75rem 0.875rem; border: 1px solid var(--line); border-radius: 0.5rem; background: var(--page); font-size: 0.875rem; }
    .facts.stacked { grid-template-columns: minmax(0, 1fr); gap: 0.125rem; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.04em; }
    .divider { display: flex; align-items: center; gap: 0.75rem; color: var(--muted); font-size: 0.8125rem; }
    .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
    .foot { display: flex; flex-direction: column; gap: 0.25rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.875rem; }
    .foot a { color: var(--text); font-weight: 600; }

    @media (max-width: 30rem) {
      body { place-items: start stretch; padding: 0; background: var(--card); }
      main { max-width: none; min-height: 100svh; padding: 1.5rem 1.25rem; border: 0; border-radius: 0; box-shadow: none; }
      .actions.pair { flex-direction: column; }
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <main>
    <div class="brand">{% include "marks/crucible_logo.svg" %}<span>Crucible</span></div>
    <h1>{{ self.title() }}</h1>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
