[project]
name = "crucible-api"
version = "3.3.0"
description = "Crucible API: scientific records service for the Molecular Foundry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=5.5.2",
    "fastapi==0.162.0",
    "google-api-core==2.24.0",
    "google-auth==2.62.0",
    "google-cloud-secret-manager==2.22.1",
    "google-cloud-storage>=3.4.1",
    "gunicorn",
    "mfid==1.0.0",
    "paho-mqtt>=2.1.0",
    "pika==1.4.4",
    "pillow==13.0.0",
    "pgvector>=0.4.1",
    "psycopg2-binary>=2.9.11",
    "python-multipart==0.0.32",
    "pydantic>=2.14,<3",
    "requests>=2.33.1",
    "joserfc>=1.7.5",
    "google-crc32c>=1.8.0",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.37",
    "sqlmodel==0.0.48",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "alembic>=1.19.1",
    "protobuf>=5.29.6,<6",
    "authlib>=1.8,<2",
    "python-dotenv>=1.0.1",
    "pydantic-settings==2.16.1",
    "boto3==1.43.113",
    "awscrt==0.37.0",
]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "mako>=1.4.2",
    "pyasn1>=0.6.4",
    "starlette>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyflakes>=3.2.0",
    "httpx>=0.28.1",
]
