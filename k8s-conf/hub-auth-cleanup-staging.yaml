apiVersion: batch/v1
kind: CronJob
metadata:
  name: crucible-hub-auth-cleanup-staging
  namespace: default
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: crucible-hub-auth-cleanup-staging
        spec:
          restartPolicy: Never
          serviceAccountName: default
          terminationGracePeriodSeconds: 30
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: us-central1-docker.pkg.dev/mf-crucible/crucible-api/crucible-api-staging:latest
              imagePullPolicy: Always
              command: ["/root/.venv/bin/python", "/root/scripts/cleanup_hub_auth.py"]
              args: ["--commit", "--batch-size", "1000", "--batches", "10"]
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: API_CONF_FILE
                  valueFrom:
                    configMapKeyRef:
                      name: crucible-api-config-staging
                      key: API_CONF_FILE
                - name: DB_SERVER
                  valueFrom:
                    configMapKeyRef:
                      name: crucible-api-config-staging
                      key: db_server
                - name: DB_USERNAME
                  valueFrom:
                    configMapKeyRef:
                      name: crucible-api-config-staging
                      key: db_username
                - name: DB_DATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: crucible-api-config-staging
                      key: db_database
                - name: PGDB_PW_VERSION
                  valueFrom:
                    configMapKeyRef:
                      name: crucible-api-config-staging
                      key: PGDB_PW_VERSION
                - name: DB_POOL_SIZE
                  value: "1"
                - name: DB_MAX_OVERFLOW
                  value: "0"
                - name: PGCONNECT_TIMEOUT
                  value: "10"
                - name: PGOPTIONS
                  value: "-c statement_timeout=60000 -c lock_timeout=5000"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
