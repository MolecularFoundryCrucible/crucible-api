apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "crucible-api-staging"
  namespace: "default"
  labels:
    app: crucible-api-staging
spec:
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: "crucible-api-staging"
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        gke-gcsfuse/cpu-limit: "4"
        gke-gcsfuse/cpu-request: 1000m
        gke-gcsfuse/memory-limit: 1000Gi
        gke-gcsfuse/memory-request: 1Gi
        gke-gcsfuse/volumes: "true"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        autoscaling.knative.dev/target: "5"
      labels:
        app: "crucible-api-staging"
      name: crucible-api-staging
      namespace: default
    spec:
      containers:
      - env:
        - name: "HUB_AUTH_ENABLED"
          valueFrom:
            configMapKeyRef:
              key: HUB_AUTH_ENABLED
              name: crucible-api-config-staging
        - name: "HUB_AUTH_CLIENT_ID"
          valueFrom:
            configMapKeyRef:
              key: HUB_AUTH_CLIENT_ID
              name: crucible-api-config-staging
        - name: "HUB_AUTH_CALLBACK_URI"
          valueFrom:
            configMapKeyRef:
              key: HUB_AUTH_CALLBACK_URI
              name: crucible-api-config-staging
        - name: "HUB_AUTH_PUBLIC_API_URL"
          valueFrom:
            configMapKeyRef:
              key: HUB_AUTH_PUBLIC_API_URL
              name: crucible-api-config-staging
        - name: "HUB_AUTH_ORCID_ISSUER"
          valueFrom:
            configMapKeyRef:
              key: HUB_AUTH_ORCID_ISSUER
              name: crucible-api-config-staging
        - name: "HUB_AUTH_ORCID_CLIENT_ID"
          valueFrom:
            configMapKeyRef:
              key: HUB_AUTH_ORCID_CLIENT_ID
              name: crucible-api-config-staging
        - name: "HUB_AUTH_CLIENT_SECRET_VERSION"
          valueFrom:
            configMapKeyRef:
              key: HUB_AUTH_CLIENT_SECRET_VERSION
              name: crucible-api-config-staging
        - name: "HUB_AUTH_ORCID_CLIENT_SECRET_VERSION"
          valueFrom:
            configMapKeyRef:
              key: HUB_AUTH_ORCID_CLIENT_SECRET_VERSION
              name: crucible-api-config-staging
        - name: "PYTHONUNBUFFERED"
          value: "True"
        - name: "API_CONF_FILE"
          valueFrom:
            configMapKeyRef:
              key: API_CONF_FILE
              name: crucible-api-config-staging
        - name: "DB_TYPE"
          valueFrom:
            configMapKeyRef:
              key: db_type
              name: crucible-api-config-staging
        - name: "DB_SERVER"
          valueFrom:
            configMapKeyRef:
              key: db_server
              name: crucible-api-config-staging
        - name: "DB_USERNAME"
          valueFrom:
            configMapKeyRef:
              key: db_username
              name: crucible-api-config-staging
        - name: "DB_DATABASE"
          valueFrom:
            configMapKeyRef:
              key: db_database
              name: crucible-api-config-staging
        - name: "RMQ_ROUTING_SUFFIX"
          valueFrom:
            configMapKeyRef:
              key: RMQ_ROUTING_SUFFIX
              name: crucible-api-config-staging
        # DB_PASSWORD is fetched from Google Secret Manager by the application
        # Create the secret with: gcloud secrets create crucible-db-staging-password --data-file=-
        # Secret path: projects/776258882599/secrets/crucible-db-staging-password/versions/latest
        - name: "DB_AUTH"
          valueFrom:
            configMapKeyRef:
              key: db_auth
              name: crucible-api-config-staging
        - name: "EXPECTED_DB_REVISIONS"
          valueFrom:
            configMapKeyRef:
              key: EXPECTED_DB_REVISIONS
              name: crucible-api-config-staging
        - name: "ANTHROPIC_BASE_URL"
          valueFrom:
            configMapKeyRef:
              key: ANTHROPIC_BASE_URL
              name: crucible-api-config-staging
        - name: "ANTHROPIC_DEFAULT_HAIKU_MODEL"
          valueFrom:
            configMapKeyRef:
              key: ANTHROPIC_DEFAULT_HAIKU_MODEL
              name: crucible-api-config-staging
        - name: "UPLOAD_BUCKET"
          valueFrom:
            configMapKeyRef:
              key: UPLOAD_BUCKET
              name: crucible-api-config-staging
        - name: "STORAGE_READ_BUCKETS"
          valueFrom:
            configMapKeyRef:
              key: STORAGE_READ_BUCKETS
              name: crucible-api-config-staging
        - name: "MULTIPART_UPLOAD_ENABLED"
          valueFrom:
            configMapKeyRef:
              key: MULTIPART_UPLOAD_ENABLED
              name: crucible-api-config-staging
        - name: "MULTIPART_UPLOAD_BUCKET"
          valueFrom:
            configMapKeyRef:
              key: MULTIPART_UPLOAD_BUCKET
              name: crucible-api-config-staging
        - name: "MULTIPART_UPLOAD_SIGNER"
          valueFrom:
            configMapKeyRef:
              key: MULTIPART_UPLOAD_SIGNER
              name: crucible-api-config-staging
        - name: "MULTIPART_UPLOAD_PROJECT"
          valueFrom:
            configMapKeyRef:
              key: MULTIPART_UPLOAD_PROJECT
              name: crucible-api-config-staging
        image: "us-central1-docker.pkg.dev/mf-crucible/crucible-api/crucible-api-staging:latest"
        imagePullPolicy: Always
        name: "crucible-api-container"
        ports:
        - containerPort: 8889
          protocol: TCP
        resources:
          limits:
            cpu: 4000m
            memory: 4Gi
            ephemeral-storage: 2Gi
          requests:
            cpu: 1000m
            memory: 1Gi
            ephemeral-storage: 1Gi
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8889
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8889
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - mountPath: /mnt/gcs
          name: cruc-upload-vol2
          readOnly: false
        - mountPath: /mnt/mf-storage-prod
          name: mf-storage-prod
          readOnly: true
      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - "--private-ip"
            - "--auto-iam-authn"
            - "--structured-logs"
            - "--port=5432"
            - "mf-crucible:us-central1:crucible-db"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      volumes:
      - name: cruc-upload-vol2
        persistentVolumeClaim:
          claimName: cruc-upload-pvc2
          readOnly: false
      - name: mf-storage-prod
        persistentVolumeClaim:
          claimName: mf-storage-prod-pvc
          readOnly: true
