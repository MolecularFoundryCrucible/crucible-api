# Builds and pushes the image on each merge to main: crucible-api/crucible-api:<commit> and :main.
# Staging follows it by digest, and a vX.Y.Z tag copies it into the release repository
# (cloudbuild.release.yaml). Deployment belongs to mf-crucible-deploy.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        image=us-central1-docker.pkg.dev/${PROJECT_ID}/crucible-api/crucible-api
        version=$(awk -F '"' '/^version = / {print $$2; exit}' pyproject.toml)
        docker pull "$$image:main" || true
        docker build \
          --build-arg githash=${COMMIT_SHA} \
          --build-arg api_version="$$version" \
          --label org.opencontainers.image.title=crucible-api \
          --label org.opencontainers.image.version="$$version" \
          --label org.opencontainers.image.revision=${COMMIT_SHA} \
          --label org.opencontainers.image.source=https://github.com/MolecularFoundryCrucible/crucible-api \
          --cache-from "$$image:main" \
          --tag "$$image:${COMMIT_SHA}" \
          --tag "$$image:main" \
          .
        docker push "$$image:${COMMIT_SHA}"
        docker push "$$image:main"
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
